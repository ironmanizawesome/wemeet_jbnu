<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 피드백 코치</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .chat-container {
      width: 70%;
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 80vh;
      overflow: hidden;
    }
    .chat-header {
      background: linear-gradient(90deg, #6fbf73, #3b873e);
      color: white;
      padding: 15px;
      font-size: 1.2rem;
      text-align: center;
    }
    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .message {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 70%;
    }
    .bot {
      background: #e8f5e9;
      align-self: flex-start;
    }
    .user {
      background: #c8e6c9;
      align-self: flex-end;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }
    .chat-input input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    .chat-input button {
      background: #3b873e;
      color: white;
      border: none;
      padding: 0 20px;
      cursor: pointer;
      font-size: 1rem;
    }
    .chat-input button:hover {
      background: #2e7031;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">🤖 AI 농사 코치</div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="메시지를 입력하세요..." />
      <button id="sendBtn">전송</button>
    </div>
  </div>

  <script>
    const API_BASE = window.API_BASE_URL || "http://127.0.0.1:8000";
    const chatBody = document.getElementById("chatBody");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    const username =
      sessionStorage.getItem("username") ||
      sessionStorage.getItem("userName") ||
      "";

    if (!username) {
      alert("로그인이 필요합니다.");
      window.location.href = "login.html";
    }

    let diaryText = "";
    let todos = [];

    function sanitizeTodos(raw = []) {
      if (!Array.isArray(raw)) return [];
      return raw
        .map((item) => ({
          text:
            typeof item === "string"
              ? item
              : (item && item.text) || "",
          checked: item && typeof item.checked === "boolean"
            ? item.checked
            : false,
        }))
        .filter((item) => item.text.trim().length > 0);
    }

    function appendMessage(role, text) {
      const msg = document.createElement("div");
      msg.className = `message ${role}`;
      msg.innerHTML = text
        .replace(/\n/g, "<br>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      chatBody.appendChild(msg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function fetchLatestDiary() {
      appendMessage(
        "bot",
        "최근 일지를 불러오고 있습니다. 잠시만 기다려 주세요..."
      );

      try {
        const res = await fetch(
          `${API_BASE}/diaries/${encodeURIComponent(username)}`
        );
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        if (Array.isArray(data.diaries) && data.diaries.length) {
          const latest = data.diaries[0];
          diaryText = latest.content || "";
          todos = sanitizeTodos(latest.todos);
          appendMessage(
            "bot",
            "✍️ 현재 일지 요약:<br><br>" +
              diaryText.slice(0, 400) +
              (diaryText.length > 400 ? "..." : "")
          );
          requestFeedback("일지 전체를 검토해서 코칭을 해주세요.");
          return;
        }
      } catch (error) {
        console.error(error);
        appendMessage(
          "bot",
          "⚠️ 서버에서 일지를 불러오지 못했습니다. 저장된 일지가 있다면 로컬 데이터를 사용하겠습니다."
        );
      }

      diaryText = localStorage.getItem("diary") || "";
      let localTodos = [];
      try {
        localTodos = JSON.parse(localStorage.getItem("todos") || "[]");
      } catch (err) {
        console.warn("로컬 할 일 데이터를 불러오지 못했습니다:", err);
      }
      todos = sanitizeTodos(localTodos);

      if (diaryText) {
        appendMessage(
          "bot",
          "✍️ 로컬에 저장된 일지 요약:<br><br>" +
            diaryText.slice(0, 400) +
            (diaryText.length > 400 ? "..." : "")
        );
        requestFeedback("일지 전체를 검토해서 코칭을 해주세요.");
      } else {
        appendMessage(
          "bot",
          "아직 작성된 일지가 없습니다. 캘린더 페이지에서 일지를 작성한 뒤 다시 시도해주세요."
        );
      }
    }

    async function requestFeedback(followUp = "") {
      if (!diaryText) {
        appendMessage(
          "bot",
          "일지가 비어 있어 피드백을 제공할 수 없습니다. 먼저 일지를 작성해주세요."
        );
        return;
      }

      const loadingMsg = document.createElement("div");
      loadingMsg.className = "message bot";
      loadingMsg.textContent = "🌱 코치를 호출하는 중입니다...";
      chatBody.appendChild(loadingMsg);
      chatBody.scrollTop = chatBody.scrollHeight;
      sendBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/feedback`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            userId: username || null,
            diary: diaryText,
            todos,
            question: followUp || null,
          }),
        });

        if (!response.ok) {
          const detail = await response.text();
          throw new Error(detail || "서버 오류가 발생했습니다.");
        }

        const data = await response.json();
        loadingMsg.remove();
        appendMessage("bot", data.feedback || "피드백을 받아오지 못했습니다.");
      } catch (error) {
        console.error(error);
        loadingMsg.remove();
        appendMessage(
          "bot",
          "⚠️ 피드백 생성 중 문제가 발생했습니다. 서버 상태 또는 OpenAI API 키를 확인해주세요."
        );
      } finally {
        sendBtn.disabled = false;
      }
    }

    function handleSend() {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage("user", message);
      userInput.value = "";
      requestFeedback(message);
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        handleSend();
      }
    });

    appendMessage(
      "bot",
      "안녕하세요! 저장된 농사 일지를 기반으로 맞춤 피드백을 준비하겠습니다."
    );
    fetchLatestDiary();
  </script>
</body>
</html>
