<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>농업친구들</title>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{
      height:100%;
      overflow:hidden;
    }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
      background: linear-gradient(180deg, #87CEEB 0%, #98D8AA 50%, #5B8C5A 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    
    .cover-container {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 30px;
    }
    
    .cover-image {
      max-width: 90vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .login-btn {
      padding: 18px 80px;
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .login-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5);
    }
    
    .login-btn:active {
      transform: scale(0.98);
    }
    
    /* 로그인 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    
    .modal-overlay.show {
      display: flex;
    }
    
    .modal {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.3);
      animation: modalIn 0.3s ease;
    }
    
    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    .modal h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-size: 1.5rem;
    }
    
    .modal .field {
      margin-bottom: 18px;
    }
    
    .modal label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    
    .modal input[type="text"],
    .modal input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }
    
    .modal input:focus {
      border-color: #FF6B6B;
    }
    
    .modal .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    
    .modal .submit-btn:hover {
      opacity: 0.9;
    }
    
    .modal .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .modal .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      color: #999;
      cursor: pointer;
      background: none;
      border: none;
    }
    
    .modal-content {
      position: relative;
    }
    
    .error {
      display: none;
      background: #ffe0e0;
      color: #c00;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    
    .error.show {
      display: block;
    }
    
    .success {
      display: none;
      background: #e0ffe0;
      color: #060;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    
    .success.show {
      display: block;
    }
    
    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 0.9rem;
    }
    
    .register-link a {
      color: #FF6B6B;
      text-decoration: none;
      font-weight: 600;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="cover-container">
    <img src="images/front/farming_friends_cover.png" alt="농업친구들" class="cover-image" />
    <button class="login-btn" id="openLoginBtn">게임 시작</button>
  </div>
  
  <!-- 로그인 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-content">
        <button class="close-btn" id="closeBtn">&times;</button>
        <h2>로그인</h2>
        
        <div id="error" class="error" role="alert">아이디 또는 비밀번호를 확인해 주세요.</div>
        <div id="success" class="success" role="status">로그인 성공!</div>
        
        <form id="loginForm">
          <div class="field">
            <label for="email">아이디</label>
            <input id="email" name="email" type="text" placeholder="아이디를 입력하세요" autocomplete="username" required />
          </div>
          
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required />
          </div>
          
          <button class="submit-btn" type="submit" id="submitBtn">로그인</button>
        </form>
        
        <div class="register-link">
          계정이 없나요? <a href="register.html">회원가입</a>
        </div>
      </div>
    </div>
  </div>

  <script>
  const API_BASE = window.API_BASE_URL || "http://127.0.0.1:8000";
  const form = document.getElementById('loginForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const errorBox = document.getElementById('error');
  const okBox = document.getElementById('success');
  const submitBtn = document.getElementById('submitBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const openLoginBtn = document.getElementById('openLoginBtn');
  const closeBtn = document.getElementById('closeBtn');

  // 모달 열기
  openLoginBtn.addEventListener('click', () => {
    modalOverlay.classList.add('show');
  });

  // 모달 닫기
  closeBtn.addEventListener('click', () => {
    modalOverlay.classList.remove('show');
  });

  // 오버레이 클릭 시 닫기
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) {
      modalOverlay.classList.remove('show');
    }
  });

  // ESC 키로 닫기
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('show')) {
      modalOverlay.classList.remove('show');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    errorBox.classList.remove('show');
    okBox.classList.remove('show');

    const usernameValue = email.value.trim();
    const passwordValue = password.value.trim();

    if (!usernameValue || !passwordValue) {
      errorBox.textContent = '아이디와 비밀번호를 입력하세요.';
      errorBox.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';

    try {
      const response = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          username: usernameValue,
          password: passwordValue
        })
      });

      const data = await response.json();

      if (data.success) {
        sessionStorage.setItem('userEmail', data.email || usernameValue);
        sessionStorage.setItem('userName', data.username || usernameValue);
        sessionStorage.setItem('username', data.username || usernameValue);

        okBox.textContent = '로그인 성공!';
        okBox.classList.add('show');

        setTimeout(() => {
          window.location.href = 'character-select.html';
        }, 300);
      } else {
        errorBox.textContent = data.message || '로그인에 실패했습니다.';
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      }
    } catch (error) {
      console.error('로그인 오류:', error);
      errorBox.textContent = '서버 연결에 실패했습니다.';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = '로그인';
    }
  });
</script>

</body>
</html>
