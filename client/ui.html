<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타듀밸리 다마고치 UI</title>
    <style>
        /* 페이지 전체 스타일 */
        body {
            display: flex;
            justify-content: center; /* 가로 중앙 정렬 */
            align-items: center; /* 세로 중앙 정렬 */
            min-height: 100vh;
            margin: 0;
            background-color: #333; /* 배경이 아닌 부분은 어두운 색으로 처리 */
            font-family: sans-serif;
        }

        /* 게임 화면 컨테이너 (이미지 크기에 맞춤) */
        .game-container {
            width: 500px; /* 이미지의 비율에 맞게 조정된 너비 */
            height: 500px; /* 이미지의 비율에 맞게 조정된 높이 */
            background-image: url('KakaoTalk_20251128_222426231.png'); /* 이미지 파일 경로 */
            background-size: cover; /* 배경 이미지 크기 조정 */
            background-position: center;
            position: relative; /* 자식 요소(버튼)의 위치 기준 */
            border: 4px solid #5a5a5a; /* 이미지 테두리 */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* 하단 버튼 영역 스타일 */
        .bottom-buttons {
            position: absolute;
            bottom: 0; /* 컨테이너의 맨 아래에 위치 */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around; /* 버튼들을 균등하게 배치 */
            padding: 10px 0; /* 상하 여백 */
            /* 배경 이미지에 이미 버튼 영역이 포함되어 있어, 실제 버튼은 이미지 위의 해당 위치에 겹쳐 배치하는 것을 가정합니다. */
        }

        /* 개별 버튼 스타일 */
        .action-button {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid #000;
            border-radius: 8px;
            color: #1a1a1a;
            transition: background-color 0.2s;
            width: 30%; /* 버튼 너비 */
            text-align: center;
            line-height: 1.5;
            box-shadow: 0 4px #000; /* 픽셀 아트 스타일의 입체감 */
            margin: 0 5px; /* 버튼 간격 */
        }

        /* 각 버튼의 색상 (이미지 색상에 최대한 가깝게) */
        .water-button {
            background-color: #64b5f6; /* 파란색 계열 */
            border-color: #388e3c;
        }
        .fertilizer-button {
            background-color: #81c784; /* 녹색 계열 */
            border-color: #558b2f;
        }
        .pesticide-button {
            background-color: #ef9a9a; /* 붉은색 계열 */
            border-color: #d32f2f;
        }
        
        /* 호버 효과 */
        .action-button:hover {
            opacity: 0.9;
            box-shadow: 0 2px #000;
            transform: translateY(2px);
        }

        /* 도움말 버튼 (오른쪽 상단) */
        .help-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ffcc80; /* 노란색 계열 */
            border: 3px solid #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            text-decoration: none;
            color: #1a1a1a;
            box-shadow: 0 3px #000;
        }

        .help-button:hover {
            background-color: #ffb74d;
        }
        
        /* 텍스트 위치 조정 (이미지 UI에 맞게) */
        .button-text-overlay {
            position: absolute;
            bottom: 20px; /* 이미지 하단 버튼 영역의 대략적인 위치 */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
        }

    </style>
</head>
<body>

<div class="game-container">
    
    <a href="#" class="help-button" title="도움말">?</a>

    <div class="button-text-overlay">
        <button class="action-button water-button" onclick="alert('물 주기!')">
            물 주기
        </button>

        <button class="action-button fertilizer-button" onclick="alert('비료 주기!')">
            비료 주기
        </button>

        <button class="action-button pesticide-button" onclick="alert('농약 살포!')">
            농약 살포
        </button>
    </div>

</div>

</body>
</html>
