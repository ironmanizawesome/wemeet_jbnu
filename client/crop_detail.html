<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>작물 환경 정보 • 귀농 청년</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <header class="top-nav">
      <div class="top-nav__left">
        <div class="top-nav__logo">GN</div>
        <div class="top-nav__title">작물 환경 정보</div>
      </div>
      <nav class="top-nav__menu">
        <a href="main.html">대시보드</a>
        <a href="recommend.html">추천</a>
        <a href="calendar.html">일정</a>
        <a href="policy.html">정책</a>
      </nav>
    </header>

    <main class="crop-detail-wrapper">
      <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>작물 정보를 불러오는 중...</p>
      </div>

      <div id="cropDetail" class="crop-detail-container" style="display: none;">
        <div class="crop-header">
          <h1 id="cropName">작물명</h1>
          <a href="recommend.html" class="back-link">← 추천으로 돌아가기</a>
        </div>

        <div class="detail-grid">
          <!-- 환경 정보 카드 -->
          <section class="info-card environment-card">
            <h2>🌡️ 외부 환경 조건</h2>
            <div class="env-grid">
              <div class="env-item">
                <div class="env-icon">🌡️</div>
                <div class="env-content">
                  <h3>적정 온도</h3>
                  <p id="temperature" class="env-value">-</p>
                  <span class="env-note" id="tempNote">생육 최적 온도 범위</span>
                </div>
              </div>

              <div class="env-item">
                <div class="env-icon">💧</div>
                <div class="env-content">
                  <h3>상대 습도</h3>
                  <p id="humidity" class="env-value">-</p>
                  <span class="env-note" id="humidityNote">권장 습도 범위</span>
                </div>
              </div>

              <div class="env-item">
                <div class="env-icon">☀️</div>
                <div class="env-content">
                  <h3>일조량</h3>
                  <p id="sunlight" class="env-value">-</p>
                  <span class="env-note" id="sunlightNote">필요한 햇빛 조건</span>
                </div>
              </div>

              <div class="env-item">
                <div class="env-icon">🌱</div>
                <div class="env-content">
                  <h3>토양 온도</h3>
                  <p id="soilTemp" class="env-value">-</p>
                  <span class="env-note" id="soilTempNote">파종/정식 적정 지온</span>
                </div>
              </div>
            </div>
          </section>

          <!-- 재배 정보 -->
          <section class="info-card">
            <h2>📅 재배 시기</h2>
            <p id="seasonInfo" class="info-text">-</p>
          </section>

          <section class="info-card">
            <h2>🎯 재배 목적</h2>
            <p id="purposeInfo" class="info-text">-</p>
          </section>

          <section class="info-card">
            <h2>📊 난이도</h2>
            <p id="levelInfo" class="info-text">-</p>
          </section>

          <!-- 환경 조건 상세 -->
          <section class="info-card full-width">
            <h2>🌍 밭의 환경 조건</h2>
            <div id="environmentInfo" class="info-text">-</div>
          </section>

          <!-- 물주기 정보 -->
          <section class="info-card full-width">
            <h2>💧 물주기 가이드</h2>
            <div id="wateringInfo" class="info-text">-</div>
          </section>
        </div>
      </div>

      <div id="error" class="error-state" style="display: none;">
        <p>작물 정보를 불러오지 못했습니다.</p>
        <a href="recommend.html" class="back-link">추천으로 돌아가기</a>
      </div>
    </main>

    <style>
      .crop-detail-wrapper {
        max-width: 1200px;
        margin: 32px auto 64px;
        padding: 0 24px;
      }

      .crop-header {
        margin-bottom: 32px;
      }

      .crop-header h1 {
        font-size: 36px;
        margin: 0 0 12px;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .back-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s;
      }

      .back-link:hover {
        color: var(--primary);
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
      }

      .info-card {
        background: var(--panel);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .info-card.full-width {
        grid-column: 1 / -1;
      }

      .info-card h2 {
        margin: 0 0 16px;
        font-size: 20px;
        color: var(--text);
      }

      .info-text {
        color: var(--muted);
        line-height: 1.7;
        margin: 0;
        white-space: pre-wrap;
      }

      .environment-card {
        grid-column: 1 / -1;
      }

      .env-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 16px;
      }

      .env-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        background: #020617;
        border-radius: 12px;
        border: 1px solid var(--border);
      }

      .env-icon {
        font-size: 32px;
        flex-shrink: 0;
      }

      .env-content {
        flex: 1;
      }

      .env-content h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
      }

      .env-value {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 700;
        color: var(--primary);
      }

      .env-note {
        font-size: 12px;
        color: var(--muted);
      }

      .loading-state,
      .error-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }

      .spinner {
        border: 3px solid var(--border);
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @media (max-width: 768px) {
        .env-grid {
          grid-template-columns: 1fr;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script type="module" src="crop_detail.js"></script>
  </body>
</html>
