<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>농업 다마고치</title>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%; overflow:hidden}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', Helvetica, Arial;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    
    /* 배경 이미지 - 화면 전체 */
    .hero-image {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
    }
    
    /* 로그인 버튼 */
    .btn-login{
      position:relative;
      z-index:1;
      display:inline-block;
      padding:20px 60px;
      background:linear-gradient(135deg, #6366f1, #4f46e5);
      color:white;
      text-decoration:none;
      border-radius:16px;
      font-size:1.2rem;
      font-weight:600;
      box-shadow:0 15px 40px rgba(99, 102, 241, 0.5);
      transition:all 0.3s;
      border:none;
      cursor:pointer;
      animation:fadeIn 1s ease-out 0.5s both;
    }
    .btn-login:hover{
      transform:translateY(-3px) scale(1.02);
      box-shadow:0 20px 50px rgba(99, 102, 241, 0.6);
    }
    .btn-login:active{
      transform:translateY(0) scale(1);
    }
    
    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- 배경 이미지 -->
  <img src="images/front/farming_friends_cover.png" alt="농업 다마고치" class="hero-image" />
  
  <!-- 로그인 버튼 -->
  <a href="login.html" class="btn-login">로그인하기</a>
</body>
</html>
