<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>농업친구들</title>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{
      height:100%;
      overflow:hidden;
    }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
      background: linear-gradient(180deg, #87CEEB 0%, #98D8AA 50%, #5B8C5A 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    
    .cover-container {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 30px;
    }
    
    .cover-image {
      max-width: 90vw;
      max-height: 65vh;
      width: auto;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .login-btn {
      padding: 18px 80px;
      font-size: 1.4rem;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-decoration: none;
      display: inline-block;
    }
    
    .login-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5);
    }
    
    .login-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="cover-container">
    <img src="images/front/farming_friends_cover.png" alt="농업친구들" class="cover-image" />
    <a href="login.html" class="login-btn">게임 시작</a>
  </div>
</body>
</html>
