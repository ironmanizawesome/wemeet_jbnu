<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>농업 다마고치 - 귀농 청년 맞춤 서비스</title>
  <script src="config.js"></script>
  <style>
    :root{
      --bg:#0f172a;        /* slate-900 */
      --text:#e5e7eb;      /* gray-200 */
      --muted:#9ca3af;     /* gray-400 */
      --primary:#6366f1;   /* indigo-500 */
      --primary-600:#5458e9;
      --ring:#93c5fd;      /* sky-300 */
      --green:#10b981;     /* emerald-500 */
      --green-light:#34d399;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f1f5f9;      /* slate-100 */
        --text:#0f172a;    /* slate-900 */
        --muted:#64748b;   /* slate-500 */
        --primary:#4f46e5; /* indigo-600 */
        --primary-600:#4338ca;
        --ring:#2563eb;    /* blue-600 */
        --green:#059669;
        --green-light:#10b981;
      }
    }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%; overflow-x:hidden}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
      color:var(--text);
      background:
        radial-gradient(1400px 800px at 0% 0%, rgba(16, 185, 129, 0.15), transparent 50%),
        radial-gradient(1200px 700px at 100% 100%, rgba(99, 102, 241, 0.2), transparent 50%),
        radial-gradient(1000px 600px at 50% 0%, rgba(59, 130, 246, 0.1), transparent 60%),
        linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
    }
    @media (prefers-color-scheme: light){
      body{
        background:
          radial-gradient(1400px 800px at 0% 0%, rgba(16, 185, 129, 0.08), transparent 50%),
          radial-gradient(1200px 700px at 100% 100%, rgba(99, 102, 241, 0.12), transparent 50%),
          radial-gradient(1000px 600px at 50% 0%, rgba(59, 130, 246, 0.06), transparent 60%),
          linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      }
    }
    
    /* 배경 이미지 영역 */
    .hero-image {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0.3;
      z-index:0;
    }
    
    /* 메인 콘텐츠 */
    .container{
      position:relative;
      z-index:1;
      text-align:center;
      max-width:800px;
      width:100%;
      animation:fadeInUp 1s ease-out;
    }
    
    @keyframes fadeInUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
    
    /* 로고 영역 */
    .logo-section{
      margin-bottom:48px;
      animation:fadeInUp 1s ease-out 0.2s both;
    }
    .logo-large{
      width:120px;
      height:120px;
      border-radius:30px;
      background: linear-gradient(135deg, var(--green), var(--primary));
      display:grid;
      place-items:center;
      color:white;
      font-size:64px;
      margin:0 auto 24px;
      box-shadow:0 20px 60px rgba(16, 185, 129, 0.4);
      animation:float 3s ease-in-out infinite;
    }
    @keyframes float{
      0%, 100%{ transform:translateY(0px); }
      50%{ transform:translateY(-10px); }
    }
    .brand-title{
      font-size:3rem;
      font-weight:800;
      margin-bottom:16px;
      background:linear-gradient(135deg, var(--green-light), var(--primary));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      line-height:1.2;
    }
    .brand-subtitle{
      font-size:1.25rem;
      color:var(--muted);
      font-weight:400;
      line-height:1.6;
    }
    
    /* 특징 섹션 */
    .features{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
      gap:24px;
      margin:64px 0;
      animation:fadeInUp 1s ease-out 0.4s both;
    }
    .feature-item{
      padding:24px;
      background:rgba(15, 23, 42, 0.6);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255, 255, 255, 0.1);
      border-radius:20px;
      transition:transform 0.3s, box-shadow 0.3s;
    }
    @media (prefers-color-scheme: light){
      .feature-item{
        background:rgba(255, 255, 255, 0.8);
        border:1px solid rgba(0, 0, 0, 0.1);
      }
    }
    .feature-item:hover{
      transform:translateY(-5px);
      box-shadow:0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .feature-icon{
      font-size:2.5rem;
      margin-bottom:12px;
    }
    .feature-title{
      font-size:1.1rem;
      font-weight:600;
      margin-bottom:8px;
    }
    .feature-desc{
      font-size:0.9rem;
      color:var(--muted);
      line-height:1.5;
    }
    
    /* CTA 버튼 */
    .cta-section{
      margin-top:64px;
      animation:fadeInUp 1s ease-out 0.6s both;
    }
    .btn-login{
      display:inline-block;
      padding:18px 48px;
      background:linear-gradient(135deg, var(--primary), var(--primary-600));
      color:white;
      text-decoration:none;
      border-radius:16px;
      font-size:1.1rem;
      font-weight:600;
      box-shadow:0 10px 30px rgba(99, 102, 241, 0.4);
      transition:all 0.3s;
      border:none;
      cursor:pointer;
    }
    .btn-login:hover{
      transform:translateY(-2px);
      box-shadow:0 15px 40px rgba(99, 102, 241, 0.5);
    }
    .btn-login:active{
      transform:translateY(0);
    }
    
    /* 반응형 */
    @media (max-width: 768px){
      .brand-title{
        font-size:2rem;
      }
      .brand-subtitle{
        font-size:1rem;
      }
      .features{
        grid-template-columns:1fr;
        gap:16px;
        margin:48px 0;
      }
      .logo-large{
        width:100px;
        height:100px;
        font-size:56px;
      }
    }
    
    /* 파티클 효과 (선택사항) */
    .particles{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:0;
    }
    .particle{
      position:absolute;
      width:4px;
      height:4px;
      background:var(--green);
      border-radius:50%;
      opacity:0.3;
      animation:particleFloat 15s infinite;
    }
    @keyframes particleFloat{
      0%{
        transform:translateY(100vh) translateX(0);
        opacity:0;
      }
      10%{
        opacity:0.3;
      }
      90%{
        opacity:0.3;
      }
      100%{
        transform:translateY(-100px) translateX(100px);
        opacity:0;
      }
    }
  </style>
</head>
<body>
  <!-- 배경 이미지 -->
  <img src="images/front/farming_friends_cover.png" alt="농업 배경" class="hero-image" />
  
  <!-- 파티클 효과 -->
  <div class="particles" id="particles"></div>
  
  <!-- 메인 콘텐츠 -->
  <div class="container">
    <div class="logo-section">
      <div class="logo-large">🌱</div>
      <h1 class="brand-title">농업 다마고치</h1>
      <p class="brand-subtitle">귀농 청년을 위한 맞춤형 농업 게임 서비스</p>
    </div>
    
    <div class="features">
      <div class="feature-item">
        <div class="feature-icon">🎮</div>
        <div class="feature-title">재미있는 게임</div>
        <div class="feature-desc">작물을 키우며 농업의 즐거움을 경험하세요</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🤖</div>
        <div class="feature-title">AI 챗봇</div>
        <div class="feature-desc">귀농 관련 궁금한 점을 언제든 물어보세요</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📚</div>
        <div class="feature-title">작물 도감</div>
        <div class="feature-desc">키운 작물을 수집하고 등급을 올려보세요</div>
      </div>
    </div>
    
    <div class="cta-section">
      <a href="login.html" class="btn-login">로그인하기</a>
    </div>
  </div>
  
  <script>
    // 파티클 효과 생성
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (10 + Math.random() * 10) + 's';
        particlesContainer.appendChild(particle);
      }
    }
    
    // 페이지 로드 시 파티클 생성
    window.addEventListener('DOMContentLoaded', createParticles);
  </script>
</body>
</html>
