<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Tamagotchi</title>
    <link rel="stylesheet" href="damagochi.css">
</head>
<body>
    <div class="game-container">
        <button class="help-button">
            <span class="icon">?</span>
            <span class="text">도움말</span>
        </button>

        <div class="tamagotchi-display">
            </div>

        <div class="action-buttons-container">
            <button class="action-button water-button">
                <span class="icon">💧</span> 물 주기
            </button>
            <button class="action-button fertilizer-button">
                <span class="icon">🌿</span> 비료 주기
            </button>
            <button class="action-button pest-button">
                <span class="icon">🚫🐛</span> 해충 퇴치
            </button>
        </div>
    </div>
</body>
</html>
